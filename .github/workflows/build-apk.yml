name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build
      env:
        VITE_ADMOB_BANNER_ID: ca-app-pub-5901537254343592/4973586423
        VITE_ADMOB_INTERSTITIAL_ID: ca-app-pub-5901537254343592/1988330432

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug

    - name: Build Debug AAB
      working-directory: android
      run: ./gradlew bundleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: neon-blitz-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Debug AAB
      uses: actions/upload-artifact@v4
      with:
        name: neon-blitz-debug-aab
        path: android/app/build/outputs/bundle/debug/app-debug.aab
        retention-days: 30
